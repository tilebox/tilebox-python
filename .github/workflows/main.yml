name: CI

permissions: {}

on:
  push:
    branches: [main]
  pull_request:
    branches: ["**"]

jobs:
  code-quality:
    name: Check coding standards
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: true
      - name: Set up uv
        uses: astral-sh/setup-uv@v10.1.0
        with:
          python-version: "3.13"
          enable-cache: true
          cache-python: true
          cache-dependency-glob: "uv.lock"
      - name: Sync
        run: uv sync --all-packages --frozen
      - name: Ruff
        run: uv run ruff format --check . && uv run ruff check .
      - name: Ty
        run: |
          uv run ty check --python-version 3.11
          uv run ty check --python-version 3.14

  tests:
    name: Run tests
    strategy:
      matrix:
        os: [Ubuntu]
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    runs-on: ${{ matrix.os }}-latest
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: true
      - name: Set up uv
        uses: astral-sh/setup-uv@v10.1.0
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
          cache-python: true
          cache-dependency-glob: "uv.lock"
      - name: Sync
        run: uv sync --all-packages --frozen
      - name: Run tests
        run: ./tests.sh
      - name: Test Summary
        uses: test-summary/action@v2
        with:
          paths: "test-report.xml"
        if: always()

  windows-runtime:
    name: Test Windows worker runtime
    strategy:
      matrix:
        python-version: ["3.11", "3.14"]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: true
      - name: Set up uv
        uses: astral-sh/setup-uv@v10.1.0
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
          cache-python: true
          cache-dependency-glob: "uv.lock"
      - name: Sync
        run: uv sync --package tilebox-workflows --frozen
      - name: Test worker lifecycle and logging
        run: >-
          uv run --frozen --package tilebox-workflows pytest
          tilebox-workflows/tests/runner/test_worker_server.py
          tilebox-workflows/tests/runner/test_worker_concurrency.py
          tilebox-workflows/tests/runner/test_runtime_logging.py
          tilebox-workflows/tests/runner/test_log_stream.py
          tilebox-workflows/tests/observability/test_logging.py

  minimum-dependencies:
    name: Test minimum dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: true
      - name: Set up uv
        uses: astral-sh/setup-uv@v10.1.0
        with:
          python-version: "3.11"
      - name: Resolve lowest compatible direct dependencies
        # Select the SDK packages, not the root's unbounded lint/build tooling.
        run: >-
          uv sync --resolution lowest-direct --upgrade
          --package tilebox-grpc --package tilebox-datasets
          --package tilebox-storage --package tilebox-workflows
      - name: Run tests without replacing the minimum-version environment
        run: |
          for package in tilebox-grpc tilebox-datasets tilebox-storage tilebox-workflows; do
            uv run --no-sync pytest "$package" -Wall -Werror --import-mode=importlib
          done
