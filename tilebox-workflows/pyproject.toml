[project]
name = "tilebox-workflows"
dynamic = ["version"]
description = "Workflow client and task runner for Tilebox"
authors = [{ name = "Tilebox, Inc.", email = "support@tilebox.com" }]
readme = "README.md"
license = { text = "MIT License" }
classifiers = [
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering",
    "Topic :: Software Development",
]
requires-python = ">=3.11"
dependencies = [
    "tilebox-datasets>=0.56.0",
    "tilebox-grpc>=0.28.0",
    # Require the security fixes even with an older tilebox-grpc release.
    "grpcio>=1.84.0",
    "google-auth[requests]>=2.29",
    "azure-identity>=1.23",
    "opentelemetry-api>=1.43.0",
    "opentelemetry-exporter-otlp-proto-http>=1.43.0",
    "opentelemetry-sdk>=1.43.0",
    "tenacity>=8",
    "boto3>=1.40.2",
    "obstore>=0.8.2",
    "opentelemetry-proto>=1.43.0",
    "opentelemetry-instrumentation-logging>=0.64b0",
    "msgspec>=0.19",
]

[project.optional-dependencies]
notebook = ["ipywidgets>=8.1.7"]
geospatial = [
    "affine>=2",
    "odc-geo>=0.5",
    "pyproj>=3.4",
    "shapely>=2",
]

[dependency-groups]
dev = [
    "boto3-stubs[s3]>=1.40.2",
    "hypothesis>=6.112.1",
    "ipywidgets>=8.1.7",
    "odc-geo>=0.5",
    "pytest-cov>=5.0.0",
    "pytest>=8.4",
    "moto>=5",
    "pytest-asyncio>=1.4.0",
]

[project.urls]
Homepage = "https://tilebox.com"
Documentation = "https://docs.tilebox.com/workflows/introduction"

[tool.hatch.build.targets.sdist]
packages = ["tilebox"]

[tool.hatch.build.targets.wheel]
packages = ["tilebox"]

[tool.coverage.run]
omit = ["tilebox/workflows/workflows/v1/*"]

[tool.pytest.ini_options]
minversion = "6.0"
testpaths = ["tests"]
addopts = "-Wall -Werror --import-mode importlib"
asyncio_default_fixture_loop_scope = "function"

[build-system]
requires = ["hatchling", "uv-dynamic-versioning"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "uv-dynamic-versioning"
