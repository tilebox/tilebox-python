[project]
name = "tilebox-core"
dynamic = ["version"]
description = "Shared types and client infrastructure for Tilebox"
authors = [{ name = "Tilebox, Inc.", email = "support@tilebox.com" }]
readme = "README.md"
license = { text = "MIT License" }
requires-python = ">=3.11"
dependencies = [
    "connectrpc>=0.12.1,<0.13",
    "protobuf-py>=0.6.0,<0.7",
    "pyqwest>=0.7.0",
    "anyio>=4",
]

[dependency-groups]
dev = ["pytest-asyncio>=0.24.0", "pytest-cov>=5.0.0", "pytest>=8.3.2"]

[project.urls]
Homepage = "https://tilebox.com"
Documentation = "https://docs.tilebox.com/"

[tool.hatch.build.targets.sdist]
packages = ["_tilebox", "tilebox"]

[tool.hatch.build.targets.wheel]
packages = ["_tilebox", "tilebox"]

[tool.coverage.run]
omit = ["_tilebox/proto/*"]

[tool.pytest.ini_options]
minversion = "6.0"
testpaths = ["tests"]
addopts = "-Wall -Werror --import-mode importlib"
asyncio_default_fixture_loop_scope = "function"

[build-system]
requires = ["hatchling", "uv-dynamic-versioning"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "uv-dynamic-versioning"
